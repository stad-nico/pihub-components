<main class="mt-2">
	<p class="text-text-primary text-2xl">{{ title() }}</p>
	<p class="text-text-secondary">{{ description() }}</p>
</main>

<pihub-icon
	tabindex="0"
	[icon]="ICONS.close"
	color="--color-text-primary"
	(click)="modal.dismissModal.emit()"
	class="hover:bg-neutral-800 p-1.5 ml-auto cursor-pointer transition-background-color duration-200 rounded-2xl"
/>
