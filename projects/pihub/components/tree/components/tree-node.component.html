<ng-container *ngTemplateOutlet="template(); context: templateContext()" />

<ng-template #childrenTemplate>
	@for (child of children(); track child.id) {
		<pihub-tree-node
			[node]="child"
			[(expandedIds)]="expandedIds"
			[(selectedId)]="selectedId"
			[nodes]="nodes()"
			[template]="template()"
			(nodeSelected)="select(child.id)"
		/>
	}
</ng-template>
